# Release of the npm package @sbtp/wasm (ADR 0053 rules 30, 31, 37, 38 and 41). DRAFT, DISABLED.
#
# Publication needs the project organisation's npm account and the `@sbtp` scope, which do not
# exist yet. Until the owner enables it, this workflow publishes nothing:
#   - it has no automatic trigger: the `push` trigger on release tags is commented out below, and
#     only a manual `workflow_dispatch` remains;
#   - every job is guarded by the repository variable NPM_PUBLISH_ENABLED, which is not set, so even
#     a manual run skips both jobs.
#
# To enable it (owner, once): create the npm organisation and scope with two-factor authentication;
# configure a trusted publisher for @sbtp/wasm on npmjs.com (repository sbtp-protocol/sbtp, workflow
# file release-npm.yml, environment npm-release, publishing allowed); create the GitHub environment
# `npm-release` with required reviewers and deployments limited to tags `wasm-v*`; protect the tag
# pattern `wasm-v*` with a ruleset (no update, no deletion, creation by maintainers only); set the
# repository variable NPM_PUBLISH_ENABLED to `true`; then uncomment the `push` trigger.
#
# A release: tag `wasm-v<version>` on a commit of `main` whose crates/sbtp-wasm/npm/package.json
# carries <version>. The `build` job (read-only token, no OIDC) builds the tarball with the pinned
# tools of crates/sbtp-wasm/npm/build.sh, runs the contents check and the smoke test, and hands the
# tarball over as an artifact with its SHA-256. The `publish` job, the only one with
# `id-token: write`, checks that SHA-256 and publishes that exact tarball with a provenance statement,
# through npm trusted publishing (OpenID Connect): no npm token exists anywhere. Every action is
# pinned by full commit SHA; there is no cache.

name: Release npm (@sbtp/wasm)

on:
  # Disabled: no automatic trigger until the owner enables publication (see the header).
  # push:
  #   tags: ["wasm-v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and check the tarball
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'wasm-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same pins as the npm-package job of ci.yml, which build.sh checks.
      NODE_VERSION: v22.23.4
      NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      WASM_BINDGEN_VERSION: 0.2.130
    outputs:
      tarball: ${{ steps.build.outputs.tarball }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Rule 37: a protected tag on a commit reachable from main, carrying the package version.
      - name: Tag, version and main
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' crates/sbtp-wasm/npm/package.json)"
          if [ "$tag" != "wasm-v$version" ]; then
            echo "::error::tag $tag does not match the package version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main"
            exit 1
          fi

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install || rustup show
          rustup show active-toolchain

      - name: Install Node.js (pinned archive)
        run: |
          set -euo pipefail
          archive="node-$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/$NODE_VERSION/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install binaryen (pinned archive)
        run: |
          set -euo pipefail
          archive="binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Build, contents check
        id: build
        run: |
          set -euo pipefail
          sh crates/sbtp-wasm/npm/build.sh dist-npm
          tarball="$(cd dist-npm && ls sbtp-wasm-*.tgz)"
          sha256="$(sha256sum "dist-npm/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "### $tarball" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 \`$sha256\`, source commit \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: dist-npm/${{ steps.build.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish with provenance
    needs: build
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'wasm-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protected environment: required reviewers, deployments from `wasm-v*` tags only. Its name is
    # part of the trusted publisher configured on npmjs.com.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and the provenance statement; this job only
    env:
      # Trusted publishing needs npm 11.5.1 or later: Node.js 24.22.2 (npm 11.19.1), released on
      # 2026-10-27. It only uploads the tarball built above, so it does not change its bytes.
      NODE_VERSION: v24.22.2
      NODE_SHA256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
      TARBALL: ${{ needs.build.outputs.tarball }}
      TARBALL_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Install Node.js (pinned archive)
        run: |
          set -euo pipefail
          archive="node-$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/$NODE_VERSION/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist-npm

      - name: Same tarball as the build job
        run: echo "$TARBALL_SHA256  dist-npm/$TARBALL" | sha256sum --check --strict

      - name: Publish
        run: |
          set -euo pipefail
          npm --version
          npm publish "dist-npm/$TARBALL" --provenance --access public --ignore-scripts
