# Release of the npm package @sbtp/wasm (ADR 0053 rules 30, 31, 37, 38 and 41). DRAFT, DISABLED.
#
# Publication needs the project organisation's npm account and the `@sbtp` scope, which do not
# exist yet. Until the owner enables it, this workflow publishes nothing: its only trigger is a
# manual `workflow_dispatch`, and every job is guarded by the repository variable
# NPM_PUBLISH_ENABLED, which is not set, so even a manual run skips every job.
#
# Why it runs from `main` (security review 2026-11-22, M-1): the workflow file that runs is the copy
# in the ref the run starts from. A tag trigger would run the copy of whatever commit was tagged, so
# a check "the commit is on main" written in that file would be under the tagger's control. A run
# dispatched on `main` runs the reviewed file on `main`, and the environment `npm-release` accepts
# deployments from the branch `main` only, so a run dispatched on any other branch cannot reach the
# environment, whose name the npm trusted publisher requires.
#
# To enable it (owner, once):
#   1. Create the npm organisation and the `@sbtp` scope, with two-factor authentication.
#   2. On npmjs.com, configure a trusted publisher for @sbtp/wasm: repository sbtp-protocol/sbtp,
#      workflow file release-npm.yml, environment npm-release.
#   3. Create the GitHub environment `npm-release` with required reviewers and the deployment
#      branch policy "selected branches": `main` only (no tag pattern).
#   4. Protect the tag pattern `wasm-v*` with a ruleset: no update, no deletion.
#   5. Set the repository variable NPM_PUBLISH_ENABLED to `true`.
#
# A release: bump crates/sbtp-wasm/npm/package.json (and the crate) to <version> on `main`, then run
# this workflow on `main` with the input `version` = <version>. It releases the head of `main` at
# dispatch time (GITHUB_SHA).
#   - `build` (read-only token, no OIDC) checks the input against package.json and the tag
#     `wasm-v<version>`: if the tag exists it MUST point at GITHUB_SHA, otherwise it is created by
#     the `tag` job once the package is published. It builds the tarball with the pinned tools of
#     crates/sbtp-wasm/npm/build.sh, runs the contents check and the smoke test, and hands the
#     tarball over as an artifact with its SHA-256.
#   - `publish`, the only job with `id-token: write`, runs in the environment `npm-release` (the
#     reviewer approves it), checks that SHA-256 and publishes that exact tarball with a provenance
#     statement through npm trusted publishing (OpenID Connect): no npm token exists anywhere.
#   - `tag`, the only job with `contents: write`, creates the tag on GITHUB_SHA if it did not exist.
# Every action is pinned by full commit SHA; there is no cache.

name: Release npm (@sbtp/wasm)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (the version of crates/sbtp-wasm/npm/package.json on main)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-npm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and check the tarball
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Same pins as the npm-package job of ci.yml, which build.sh checks.
      NODE_VERSION: v22.23.4
      NODE_SHA256: 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      WASM_BINDGEN_VERSION: 0.2.130
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
      tarball: ${{ steps.build.outputs.tarball }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all history and tags, for the tag check below

      # Rule 37: the version asked for is the package version, and its tag, if it already exists,
      # is on the commit this run builds (the head of main at dispatch time).
      - name: Version and tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the input version is not a semver version"
            exit 1
          fi
          package="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' crates/sbtp-wasm/npm/package.json)"
          if [ "$VERSION" != "$package" ]; then
            echo "::error::input $VERSION does not match the package version $package on main"
            exit 1
          fi
          tag="wasm-v$VERSION"
          if tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag exists on $tagged, not on $GITHUB_SHA"
              exit 1
            fi
            exists=true
          else
            exists=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install || rustup show
          rustup show active-toolchain

      - name: Install Node.js (pinned archive)
        run: |
          set -euo pipefail
          archive="node-$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/$NODE_VERSION/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install binaryen (pinned archive)
        run: |
          set -euo pipefail
          archive="binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Build, contents check
        id: build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sh crates/sbtp-wasm/npm/build.sh dist-npm
          # Exactly one tarball, the build of this commit (a dirty build would end in -dirty.tgz).
          set -- dist-npm/sbtp-wasm-*.tgz
          if [ "$#" -ne 1 ] || [ "$1" != "dist-npm/sbtp-wasm-$VERSION.tgz" ]; then
            echo "::error::expected exactly dist-npm/sbtp-wasm-$VERSION.tgz, found: $*"
            exit 1
          fi
          tarball="${1#dist-npm/}"
          sha256="$(sha256sum "dist-npm/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "### $tarball" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 \`$sha256\`, source commit \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test of the installed package
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: sh crates/sbtp-wasm/npm/smoke.sh "dist-npm/$TARBALL"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: dist-npm/${{ steps.build.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish with provenance
    needs: build
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protected environment: required reviewers, deployments from the branch `main` only. Its name
    # is part of the trusted publisher configured on npmjs.com.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and the provenance statement; this job only
    env:
      # Trusted publishing needs npm 11.5.1 or later: Node.js 24.22.2 (npm 11.19.1), released on
      # 2026-10-27. It only uploads the tarball built above, so it does not change its bytes.
      NODE_VERSION: v24.22.2
      NODE_SHA256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
      TARBALL: ${{ needs.build.outputs.tarball }}
      TARBALL_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Install Node.js (pinned archive)
        run: |
          set -euo pipefail
          archive="node-$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/$NODE_VERSION/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist-npm

      - name: Same tarball as the build job
        run: echo "$TARBALL_SHA256  dist-npm/$TARBALL" | sha256sum --check --strict

      - name: Publish
        run: |
          set -euo pipefail
          npm --version
          # The registry is named here, so that no publishConfig of the manifest can redirect it.
          npm publish "dist-npm/$TARBALL" --registry https://registry.npmjs.org/ \
            --provenance --access public --ignore-scripts

  tag:
    name: tag the published commit
    needs: [build, publish]
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the release tag; this job only
    env:
      TAG: ${{ needs.build.outputs.tag }}
      TAG_EXISTS: ${{ needs.build.outputs.tag_exists }}
    steps:
      - name: Create the tag on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TAG_EXISTS" = true ]; then
            echo "$TAG already points at $GITHUB_SHA"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
