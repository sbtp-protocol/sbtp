[workspace]
members = ["crates/sbtp-core", "crates/sbtp-relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["The SBTP Contributors"]
license = "MIT OR Apache-2.0"

# Vetted dependencies, the versions v0.2 used. A member crate uses them via `xxx.workspace = true`.
# No git dependency, no "*" version, nothing published less than two weeks ago. Cargo.lock is
# committed.
[workspace.dependencies]
sbtp-core = { path = "crates/sbtp-core", version = "0.1.0", default-features = false }

blake3 = { version = "1.8.7", default-features = false }
# Never enable `batch` or `legacy_compatibility` (SPEC §3: strict, cofactorless, no batch; also
# denied in deny.toml).
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

# Relay (crates/sbtp-relay). Every version below is the one v0.2's Cargo.lock held, except
# `tracing-subscriber` (new in v1, see its comment).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
# No default features: no form, JSON or query extractors, no HTTP/2. `ws` adds the WebSocket upgrade
# (tokio-tungstenite, sha1, base64).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Log lines to stderr (PRINCIPLES "Relay scope"). New in v1: tokio-rs project, 0.3.23 published
# 2026-03-13. `fmt` only: no ANSI colours, no env-filter (and its regex), no tracing-log.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The store. Exact pin, default features only, never `Builder::set_concurrency_mode()`: the
# owner-approved, reviewed exception of 2026-11-18 (legacy/v0.2
# docs/security/2026-11-18-redb-4.6-exception.md, lock checksum 096b1dd5…535ef). Needs Rust 1.90.
redb = "=4.6.0"
# The 16 random bytes of `relay_id` (SPEC §5 `/info`). Already in the graph.
getrandom = "0.4.3"

# Tests and benches
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
proptest = "1.12.0"
criterion = "0.8.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Defence in depth: in our own crates an unexpected integer overflow panics instead of wrapping.
[profile.release.package.sbtp-core]
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
arithmetic_side_effects = "warn"
