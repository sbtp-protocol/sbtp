[workspace]
members = ["crates/sbtp-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["The SBTP Contributors"]
license = "MIT OR Apache-2.0"

# Vetted dependencies, the versions v0.2 used. A member crate uses them via `xxx.workspace = true`.
# No git dependency, no "*" version, nothing published less than two weeks ago. Cargo.lock is
# committed.
[workspace.dependencies]
sbtp-core = { path = "crates/sbtp-core", version = "0.1.0", default-features = false }

blake3 = { version = "1.8.7", default-features = false }
# Never enable `batch` or `legacy_compatibility` (SPEC §3: strict, cofactorless, no batch; also
# denied in deny.toml).
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

# Tests and benches
proptest = "1.12.0"
criterion = "0.8.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Defence in depth: in our own crates an unexpected integer overflow panics instead of wrapping.
[profile.release.package.sbtp-core]
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
arithmetic_side_effects = "warn"
