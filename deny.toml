# cargo-deny: `cargo deny check`. Docs: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
# crates.io only: no git dependency, no other registry.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC", # ring and rustls-webpki, through the CLI's TLS
    "MIT",
    "Unicode-3.0",
]

# libfuzzer-sys (fuzz/ only, never shipped) bundles LLVM libFuzzer under the permissive NCSA licence.
# Scoped exception (v0.2 security review 2026-11-18, F-3). Unmatched, hence a warning, in the root check.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# webpki-roots (CLI TLS) ships the Mozilla root list as data under the permissive CDLA-Permissive-2.0.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# SPEC §3: batch verification and the lax `S` check are forbidden. This complements the
# `c3_v3_s_plus_l` test vector; it does not replace it.
[[bans.features]]
name = "ed25519-dalek"
deny = ["batch", "legacy_compatibility"]

[[bans.features]]
name = "curve25519-dalek"
deny = ["legacy_compatibility"]
