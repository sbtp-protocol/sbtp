[package]
name = "cli-demo"
description = "Experimentation CLI: generate a key pair, mine the PoW, sign and publish a block."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
sbtp-core = { workspace = true, features = ["std"] }
ureq.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# `O_NOFOLLOW` when opening the key file: a constant only, no `unsafe`.
libc.workspace = true

[dev-dependencies]
# The end-to-end test starts the relay in-process on a loopback port. sbtp-relay needs Rust 1.90
# (redb 4.x): running this crate's tests needs that toolchain, building the CLI does not.
sbtp-relay.workspace = true
tokio.workspace = true

[lints]
workspace = true
