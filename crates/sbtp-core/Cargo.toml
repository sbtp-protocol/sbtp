[package]
name = "sbtp-core"
description = "SBTP layer 0: binary block format, BLAKE3 block_id, strict Ed25519 signature, proof of work. no_std."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["std"]
# Adds `UnsignedBlock::sign`, which returns a `Vec<u8>`, and `std::error::Error` through `core`.
std = []

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
zerocopy.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
