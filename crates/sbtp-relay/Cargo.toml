[package]
name = "sbtp-relay"
description = "SBTP dumb relay: validation (format, PoW, Ed25519), content-addressed flat-file storage, LRU cache, HTTP/WS API."
version.workspace = true
edition.workspace = true
# ADR 0013 rule 25: redb 4.x requires Rust 1.90, now the workspace value (hpke review F-1).
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sbtp-core = { workspace = true, features = ["std"] }
# ADR 0021 rule 13: the keyed client tag. Already in the graph through sbtp-core.
blake3.workspace = true
redb.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body.workspace = true
tower.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
# ADR 0048 rule 19: the outbound TLS client of replication, compiled only with the feature.
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
# ADR 0050 rule 25: SHA-256 and HMAC-SHA256 for SigV4, compiled only with `object-store`.
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# ADR 0050 rule 22: the archive copy's credentials are wiped on drop. Already in the graph.
zeroize.workspace = true

[features]
# ADR 0048 rule 3: compiled into the published binary, off at run time unless `peers` is set.
default = ["replication"]
replication = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs"]
# ADR 0050 rule 26: the archive copy. Not a default feature; the published image is built with
# it, off at run time unless `mirror_endpoint` is set. It reuses the outbound HTTP and TLS
# client of replication, hence `replication`.
object-store = ["replication", "dep:sha2", "dep:hmac"]

[lints]
workspace = true
