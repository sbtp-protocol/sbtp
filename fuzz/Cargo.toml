[package]
name = "sbtp-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "cargo-fuzz targets for sbtp-core and sbtp-l2. How to seed and run them: fuzz/README.md"

[package.metadata]
cargo-fuzz = true

# Standalone workspace (usual cargo-fuzz layout): the fuzz crate is not a member of the main
# workspace, so it cannot use `workspace = true`. Versions are pinned by fuzz/Cargo.lock, which is
# committed and checked with the same two-week rule as the root lock file.
[dependencies]
libfuzzer-sys = "0.4.13"
sbtp-core = { path = "../crates/sbtp-core", version = "0.1.0" }
sbtp-l2 = { path = "../crates/sbtp-l2", version = "0.1.0" }

[workspace]
members = ["."]

[[bin]]
name = "decode_block"
path = "fuzz_targets/decode_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_l2"
path = "fuzz_targets/validate_l2.rs"
test = false
doc = false
bench = false
